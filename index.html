<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="weather-app">
    <div class="weather-container">
      
      <!-- Weather Info -->
      <div class="weather-information">
        <h1 id="temp" class="temp">--°C</h1>
        <h2 id="city-name" class="city">City</h2>
        <h4 id="date-time" class="time">--</h4>
        <img id="icon" class="icon" alt="Weather Icon">
        <h3 id="condition2" class="condition">--</h3>
      </div>

      <!-- Weather Controls -->
      <div class="weather-suggestions">
        <input id="input" class="input" type="text" placeholder="Enter city name">
        <button id="btn" class="search"><i class="fa fa-search"></i></button>
        <button id="getlocation" class="location"><i class="fa fa-location-arrow"></i> My Location</button>
        
        <div class="preset-cities">
          <span class="city">London</span>
          <span class="city">Kabul</span>
          <span class="city">Ottawa</span>
          <span class="city">California</span>
        </div>

        <h3 class="weather-de">Weather Details</h3>
        <div class="weather-details">
          <div class="row"><p>Country</p><span id="country">--</span></div>
          <div class="row"><p>Humidity</p><span id="humidity">--</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
