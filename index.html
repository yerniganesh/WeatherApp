<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="weather-app">
    <div class="weather-card">

      <!-- Search Section -->
      <div class="search-box">
        <input id="input" type="text" placeholder="Enter city name">
        <button id="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <!-- Location Button -->
      <button id="getlocation" class="location-btn"><i class="fa-solid fa-location-dot"></i> My Location</button>

      <!-- Weather Info -->
      <div class="weather-info">
        <div class="temp-city">
          <h1 id="temp">--°C</h1>
          <h2 id="city-name">City</h2>
        </div>
        <h4 id="date-time">--</h4>
        <div class="condition">
          <img id="icon" src="" alt="icon">
          <span id="condition2">--</span>
        </div>
      </div>

      <!-- Weather Details -->
      <div class="weather-details">
        <div class="detail-row"><span>Country:</span> <span id="country">--</span></div>
        <div class="detail-row"><span>Humidity:</span> <span id="humidity">--</span></div>
        <div class="detail-row"><span>Wind:</span> <span id="wind">--</span></div>
      </div>

      <!-- Preset Cities -->
      <div class="preset-cities">
        <span class="city">London</span>
        <span class="city">New York</span>
        <span class="city">Tokyo</span>
        <span class="city">Sydney</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
